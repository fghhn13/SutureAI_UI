<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>纸本风格对比</title>
<!-- Mockup only: the app itself bundles fonts locally via @fontsource. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Montserrat:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  /* ---------- Variant tokens ---------- */
  .warm {
    --paper: #f6f4ef;
    --card: #fbfaf7;
    --line: #e3dfd5;
    --rule: #c9c5ba;
    --g400: #9a968c;
    --g500: #6b6860;
    --g700: #3d3b36;
    --ink: #1f1e1b;
    --wash: #eeebe3;
    --accent: #4a5f82;
    --accent-wash: #e6e9ef;
    --good: #6f8c6e;
    --warn: #b08a3a;
    --bad: #a9573f;
    --noise-opacity: 0.5;
  }
  .cool {
    --paper: #f2f3f2;
    --card: #fafafa;
    --line: #dfe1e0;
    --rule: #c3c7c7;
    --g400: #939899;
    --g500: #646a6c;
    --g700: #383d40;
    --ink: #1c1f21;
    --wash: #e9ebea;
    --accent: #52637a;
    --accent-wash: #e5e8ec;
    --good: #67836f;
    --warn: #a88a45;
    --bad: #9e5a4a;
    --noise-opacity: 0.4;
  }

  * { box-sizing: border-box; }
  :root { color-scheme: light; }
  body {
    margin: 0;
    background: #e9e7e2;
    font-family: Montserrat, system-ui, "Microsoft YaHei", sans-serif;
    color: #1f1e1b;
    -webkit-font-smoothing: antialiased;
  }

  .toolbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: rgba(246, 244, 239, 0.92);
    border-bottom: 1px solid #d9d5cb;
    backdrop-filter: blur(6px);
    font-size: 13px;
  }
  .toolbar h1 { margin: 0 auto 0 0; font: 600 15px Barlow, sans-serif; letter-spacing: .02em; }
  .toolbar button {
    font: 600 12px Montserrat, sans-serif;
    padding: 6px 12px; border-radius: 6px;
    border: 1px solid #c9c5ba; background: #fbfaf7; color: #3d3b36; cursor: pointer;
  }
  .toolbar button[aria-pressed="true"] { background: #3d3b36; border-color: #3d3b36; color: #fbfaf7; }
  .seg { display: inline-flex; gap: 4px; align-items: center; }
  .seg span { color: #6b6860; margin-right: 4px; }

  .grid {
    display: grid; gap: 24px;
    grid-template-columns: 1fr;
    padding: 24px 16px 48px;
    max-width: 1400px; margin: 0 auto;
  }
  @media (min-width: 1180px) { .grid { grid-template-columns: 1fr 1fr; } }

  /* ---------- Paper sheet ---------- */
  .sheet {
    position: relative;
    background: var(--paper);
    color: var(--ink);
    border-radius: 6px;
    padding: 28px 24px 32px;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 12px 30px -18px rgba(40,35,25,.35);
  }
  /* Grain: SVG turbulence, multiplied onto the paper. */
  .sheet::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .36  0 0 0 .13 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .sheet > * { position: relative; z-index: 1; }

  .variant-label { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .variant-label b { font: 600 13px Barlow, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--g500); }
  .swatches { display: flex; gap: 4px; }
  .swatches i { width: 18px; height: 18px; border-radius: 3px; border: 1px solid rgba(0,0,0,.08); }

  /* ---------- Shared editorial pieces ---------- */
  .eyebrow {
    display: flex; align-items: center; gap: 10px;
    font: 600 11px Montserrat, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--g500);
  }
  .eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .eyebrow .num { font-family: Barlow, sans-serif; font-size: 13px; color: var(--accent); letter-spacing: .06em; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 20px;
    margin-top: 18px;
  }

  .title { margin: 14px 0 4px; font: 700 34px/1.1 Barlow, sans-serif; letter-spacing: -.01em; color: var(--ink); }
  body.serif .title { font: 600 36px/1.1 Newsreader, Georgia, serif; letter-spacing: -.015em; }
  .title-zh { font: 600 18px Montserrat, "Microsoft YaHei", sans-serif; color: var(--g500); margin-left: 6px; letter-spacing: .04em; }
  .task { margin: 0; font-size: 13px; color: var(--g500); }

  .head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }

  /* Rubber stamp for review status. */
  .stamp {
    flex-shrink: 0;
    margin-top: 10px;
    padding: 5px 10px;
    border: 1.5px solid var(--warn);
    outline: 1px solid var(--warn); outline-offset: 2px;
    border-radius: 3px;
    color: var(--warn);
    font: 700 12px Barlow, sans-serif; letter-spacing: .2em;
    transform: rotate(-6deg);
    opacity: .85;
  }
  .stamp.in { animation: stamp .5s cubic-bezier(.2,1.4,.4,1) both .9s; }
  @keyframes stamp { from { transform: rotate(-6deg) scale(1.6); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: .85; } }

  .meta { display: grid; grid-template-columns: repeat(2, 1fr); margin-top: 20px; border-top: 1px solid var(--line); }
  @media (min-width: 640px) { .meta { grid-template-columns: repeat(4, 1fr); } }
  .meta div { padding: 12px 12px 0 0; }
  .meta p { margin: 0; }
  .meta .k { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--g500); }
  .meta .v { margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .icon { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* Overall score */
  .overall { display: grid; gap: 20px; align-items: center; grid-template-columns: 1fr; }
  @media (min-width: 520px) { .overall { grid-template-columns: 132px 1fr; } }
  .ring { position: relative; width: 132px; height: 132px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .num b { font: 700 40px Barlow, sans-serif; color: var(--ink); font-variant-numeric: tabular-nums; }
  .ring .num span { font-size: 11px; color: var(--g400); }

  .leaders { margin: 0; padding: 0; list-style: none; font-size: 13px; }
  .leaders li { display: flex; align-items: baseline; gap: 6px; padding: 5px 0; }
  .leaders li::after { content: none; }
  .leaders .dots { flex: 1; border-bottom: 1px dotted var(--rule); transform: translateY(-3px); }
  .leaders .k { color: var(--g500); }
  .leaders .v { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .up { color: var(--good) !important; }
  .summary { margin: 14px 0 0; font-size: 13px; line-height: 1.7; color: var(--g700); }

  /* Notice: ochre left rule, no fill colour beyond a wash. */
  .notice { margin-top: 14px; padding: 10px 12px; border-left: 2px solid var(--warn); background: var(--wash); font-size: 12.5px; line-height: 1.65; color: var(--g700); display: flex; gap: 8px; }
  .notice b { color: var(--warn); }
  .notice .icon { color: var(--warn); margin-top: 2px; }

  /* Dimensions */
  .dims { display: grid; gap: 20px; grid-template-columns: 1fr; }
  @media (min-width: 560px) { .dims { grid-template-columns: 170px 1fr; } }
  .radar { width: 100%; max-width: 190px; justify-self: center; }
  .dim-row { display: grid; grid-template-columns: 92px 1fr 34px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .dim-row:last-child { border-bottom: 0; }
  .dim-row .name { color: var(--g700); }
  .dim-row .score { text-align: right; font: 600 17px Barlow, sans-serif; color: var(--ink); font-variant-numeric: tabular-nums; }
  .bar { height: 4px; background: var(--wash); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: var(--w); background: var(--g500); border-radius: 2px; transform-origin: left; }
  .bar.focus i { background: var(--accent); }
  .dim-row.focus .name { color: var(--accent); font-weight: 600; }
  .in .bar i { animation: grow 1s cubic-bezier(.22,1,.36,1) both; animation-delay: var(--d, 0s); }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* Timeline */
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: grid; grid-template-columns: 52px 14px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .tl li:last-child { border-bottom: 0; }
  .tl time { font: 500 12px "JetBrains Mono", ui-monospace, monospace; color: var(--g500); padding-top: 2px; }
  .tl .mark { width: 9px; height: 9px; margin-top: 5px; border-radius: 50%; border: 1.5px solid var(--g400); }
  .tl .mark.bad { background: var(--bad); border-color: var(--bad); }
  .tl .mark.warn { background: transparent; border-color: var(--warn); box-shadow: inset 0 0 0 2px var(--card), inset 0 0 0 5px var(--warn); }
  .tl h4 { margin: 0; font-size: 13.5px; font-weight: 600; color: var(--ink); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tl p { margin: 3px 0 0; font-size: 12.5px; color: var(--g500); line-height: 1.6; }
  .tag { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; padding: 1px 6px; border: 1px solid currentColor; border-radius: 2px; }
  .tag.bad { color: var(--bad); } .tag.warn { color: var(--warn); } .tag.ok { color: var(--g500); }
  .actions { margin-top: 6px; display: flex; gap: 14px; }
  .link { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .2s; cursor: pointer; }
  .link:hover { border-color: currentColor; }
  .link .icon { width: 12px; height: 12px; }

  /* Ink-drawn strokes */
  .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); }
  .in .draw { animation: draw 1.4s cubic-bezier(.65,0,.35,1) forwards; animation-delay: var(--d, .1s); }
  @keyframes draw { to { stroke-dashoffset: var(--to, 0); } }
  .fade { opacity: 0; }
  .in .fade { animation: fade .6s ease forwards; animation-delay: var(--d, 0s); }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .ornament { display: block; width: 220px; margin-left: auto; margin-top: -6px; color: var(--g400); }

  @media (prefers-reduced-motion: reduce) {
    .draw { stroke-dashoffset: var(--to, 0) !important; animation: none !important; }
    .fade, .in .fade { opacity: 1; animation: none; }
    .in .bar i, .stamp.in { animation: none; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <h1>纸本风格对比 · 报告页样片</h1>
    <div class="seg" role="group" aria-label="标题字体">
      <span>标题字体</span>
      <button type="button" data-font="sans" aria-pressed="true">Barlow</button>
      <button type="button" data-font="serif" aria-pressed="false">Newsreader 衬线</button>
    </div>
    <button type="button" id="replay">重放动画</button>
  </div>

  <main class="grid">
    <section class="sheet warm" data-name="A · 暖纸" data-desc="米白纸 + 墨蓝，暖灰阶"></section>
    <section class="sheet cool" data-name="B · 冷纸" data-desc="灰白纸 + 石板蓝，中性灰阶"></section>
  </main>

<template id="tpl">
  <div class="variant-label">
    <b class="vname"></b>
    <span class="swatches"></span>
  </div>

  <div class="eyebrow fade" style="--d:.05s">SutureAI · 训练评估报告</div>
  <div class="head">
    <div class="fade" style="--d:.1s">
      <h2 class="title">Training Report <span class="title-zh">训练报告</span></h2>
      <p class="task">持针器穿线与打结 · 演示任务</p>
    </div>
    <span class="stamp">待教师评审</span>
  </div>
  <svg class="ornament" viewBox="0 0 360 60" fill="none" aria-hidden="true">
    <path class="draw" style="--len:400;--d:.3s" d="M4 38 C 70 14, 130 52, 190 30 S 300 14, 356 34" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <g stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
      <path class="draw" style="--len:20;--d:1.1s" d="M44 20 l6 20"/>
      <path class="draw" style="--len:20;--d:1.2s" d="M92 24 l5 20"/>
      <path class="draw" style="--len:20;--d:1.3s" d="M140 30 l4 20"/>
      <path class="draw" style="--len:20;--d:1.4s" d="M188 22 l3 20"/>
      <path class="draw" style="--len:20;--d:1.5s" d="M236 14 l4 20"/>
      <path class="draw" style="--len:20;--d:1.6s" d="M284 14 l5 20"/>
    </g>
  </svg>
  <div class="meta fade" style="--d:.2s">
    <div><p class="k"><svg class="icon" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>学生</p><p class="v">Alex Rivera</p></div>
    <div><p class="k"><svg class="icon" viewBox="0 0 24 24"><path d="M16 14v2.2l1.6 1"/><path d="M16 2v3"/><path d="M21 7.338V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h2.338"/><path d="M3 9h5.859"/><path d="M8 2v3"/><circle cx="16" cy="16" r="6"/></svg>时间</p><p class="v">2026-10-13 12:17</p></div>
    <div><p class="k"><svg class="icon" viewBox="0 0 24 24"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>任务用时</p><p class="v">约 2 分钟</p></div>
    <div><p class="k"><svg class="icon" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>置信度</p><p class="v">中等</p></div>
  </div>

  <div class="card fade" style="--d:.3s">
    <div class="eyebrow"><span class="num">01</span>总体表现</div>
    <div class="overall" style="margin-top:16px">
      <div class="ring">
        <svg viewBox="0 0 128 128" aria-hidden="true">
          <circle cx="64" cy="64" r="56" fill="none" stroke="var(--line)" stroke-width="6"/>
          <circle class="draw" cx="64" cy="64" r="56" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" style="--len:351.86;--to:119.63;--d:.45s"/>
        </svg>
        <div class="num"><b data-count="66">66</b><span>/ 100</span></div>
      </div>
      <div>
        <ul class="leaders">
          <li><span class="k">较上次</span><span class="dots"></span><span class="v up">+3</span></li>
          <li><span class="k">维度平均</span><span class="dots"></span><span class="v">66</span></li>
          <li><span class="k">完成状态</span><span class="dots"></span><span class="v" style="color:var(--bad)">未完成</span></li>
        </ul>
        <p class="summary">持针仍不够稳定（有明显手抖、动作不均）。中途短暂拿错器械，随后纠正；第二段在穿线完成前录像中断。</p>
      </div>
    </div>
    <div class="notice">
      <svg class="icon" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      <span><b>中置信度：</b>第二段中断后没有后续画面，评分主要依据第一段及中断前的片段。</span>
    </div>
  </div>

  <div class="card fade" style="--d:.4s">
    <div class="eyebrow"><span class="num">02</span>维度得分</div>
    <div class="dims" style="margin-top:14px">
      <svg class="radar" viewBox="0 0 200 200" aria-hidden="true">
        <g fill="none" stroke="var(--line)" stroke-width="1">
          <polygon points="100,20 176.1,75.3 147,164.7 53,164.7 23.9,75.3"/>
          <polygon points="100,40 157.1,81.5 135.3,148.5 64.7,148.5 42.9,81.5" stroke-dasharray="2 3"/>
          <polygon points="100,60 138,87.6 123.5,132.4 76.5,132.4 62,87.6" stroke-dasharray="2 3"/>
          <line x1="100" y1="100" x2="100" y2="20"/><line x1="100" y1="100" x2="176.1" y2="75.3"/><line x1="100" y1="100" x2="147" y2="164.7"/><line x1="100" y1="100" x2="53" y2="164.7"/><line x1="100" y1="100" x2="23.9" y2="75.3"/>
        </g>
        <polygon class="draw" style="--len:420;--d:.7s" points="100,50.4 148.7,84.2 132,144 66.1,146.6 51.3,84.2" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/>
        <polygon class="fade" style="--d:1.6s" points="100,50.4 148.7,84.2 132,144 66.1,146.6 51.3,84.2" fill="var(--accent)" fill-opacity=".08"/>
      </svg>
      <div>
        <div class="dim-row"><span class="name">效率</span><span class="bar"><i style="--w:62%;--d:.5s"></i></span><span class="score">62</span></div>
        <div class="dim-row"><span class="name">准确性</span><span class="bar"><i style="--w:64%;--d:.58s"></i></span><span class="score">64</span></div>
        <div class="dim-row"><span class="name">流程</span><span class="bar"><i style="--w:68%;--d:.66s"></i></span><span class="score">68</span></div>
        <div class="dim-row"><span class="name">安全</span><span class="bar"><i style="--w:72%;--d:.74s"></i></span><span class="score">72</span></div>
        <div class="dim-row focus"><span class="name">成品质量 ←</span><span class="bar focus"><i style="--w:64%;--d:.82s"></i></span><span class="score">64</span></div>
      </div>
    </div>
  </div>

  <div class="card fade" style="--d:.5s">
    <div class="eyebrow"><span class="num">03</span>训练时间轴</div>
    <ol class="tl" style="margin-top:8px">
      <li>
        <time>0:03</time><span class="mark bad"></span>
        <div><h4>左手器械错误 <span class="tag bad">问题</span></h4><p>识别到剪刀，应为镊子。</p>
          <div class="actions"><a class="link"><svg class="icon" viewBox="0 0 24 24"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>回放</a><a class="link" style="color:var(--g500)">申诉</a></div></div>
      </li>
      <li>
        <time>0:26</time><span class="mark warn"></span>
        <div><h4>穿线失败 <span class="tag warn">警告</span></h4><p>第一次未穿过，准备第二次尝试。</p></div>
      </li>
      <li>
        <time>0:35</time><span class="mark"></span>
        <div><h4>穿线成功 <span class="tag ok">步骤</span></h4><p>第二次尝试成功。</p></div>
      </li>
    </ol>
  </div>
</template>

<script>
  const tpl = document.getElementById("tpl");
  document.querySelectorAll(".sheet").forEach((sheet) => {
    sheet.appendChild(tpl.content.cloneNode(true));
    sheet.querySelector(".vname").textContent = `${sheet.dataset.name} — ${sheet.dataset.desc}`;
    const cs = getComputedStyle(sheet);
    sheet.querySelector(".swatches").innerHTML = ["--paper", "--card", "--rule", "--g500", "--ink", "--accent", "--good", "--warn", "--bad"]
      .map((v) => `<i title="${v}" style="background:${cs.getPropertyValue(v)}"></i>`).join("");
  });

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function countUp(el) {
    const target = Number(el.dataset.count);
    if (reduce) { el.textContent = target; return; }
    const start = performance.now() + 450, dur = 1400;
    const tick = (now) => {
      const p = Math.min(1, Math.max(0, (now - start) / dur));
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    };
    el.textContent = 0;
    requestAnimationFrame(tick);
  }
  function play() {
    document.querySelectorAll(".sheet").forEach((s) => {
      s.classList.remove("in");
      s.querySelector(".stamp").classList.remove("in");
      void s.offsetWidth; // restart CSS animations
      s.classList.add("in");
      s.querySelector(".stamp").classList.add("in");
    });
    document.querySelectorAll("[data-count]").forEach(countUp);
  }
  document.getElementById("replay").addEventListener("click", play);
  document.querySelectorAll("[data-font]").forEach((b) =>
    b.addEventListener("click", () => {
      document.body.classList.toggle("serif", b.dataset.font === "serif");
      document.querySelectorAll("[data-font]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    }),
  );
  play();
</script>
</body>
</html>
